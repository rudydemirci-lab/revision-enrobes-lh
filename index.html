<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Révision enrobés et liants</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E4E6E5; --panel:#F5F6F4; --ink:#1F2327; --muted:#586066; --line:#C6CBCA;
  --road:#383D42; --sign:#F5B700; --sign-ink:#1A1A1A;
  --ok:#1E7A4B; --ok-bg:#DCEFE3; --bad:#B3261E; --bad-bg:#F7DDDA;
  --cond:"Barlow Condensed","Arial Narrow","Roboto Condensed",sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1B1E21; --panel:#262A2E; --ink:#ECECE7; --muted:#A4AAAE; --line:#3B4146;
    --road:#50565C; --ok:#5ED39A; --ok-bg:#1C3A2B; --bad:#FF8A80; --bad-bg:#46211E;
  }
}
:root[data-theme="dark"]{
  --bg:#1B1E21; --panel:#262A2E; --ink:#ECECE7; --muted:#A4AAAE; --line:#3B4146;
  --road:#50565C; --ok:#5ED39A; --ok-bg:#1C3A2B; --bad:#FF8A80; --bad-bg:#46211E;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--sign);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto;padding:22px 18px 56px}

/* Accueil */
.hero h1{font-family:var(--cond);font-weight:800;font-size:clamp(2.3rem,7.5vw,3.8rem);line-height:.98;margin:8px 0 10px;letter-spacing:-.01em;max-width:14ch}
.lede{color:var(--muted);margin:0 0 26px;max-width:52ch}
.groups{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.sign{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:14px;text-align:left;cursor:pointer;
  background:var(--sign);color:var(--sign-ink);border:3px solid var(--sign-ink);border-radius:9px;padding:16px 18px;
  box-shadow:inset 0 0 0 4px var(--sign),inset 0 0 0 6px var(--sign-ink)}
.sign:focus-visible{outline-color:var(--ink)}
.sign-num{font-family:var(--cond);font-weight:800;font-size:2.6rem;line-height:1}
.sign-title{display:block;font-family:var(--cond);font-weight:700;font-size:1.4rem;line-height:1.1}
.sign-sub{display:block;font-size:.93rem;line-height:1.3;margin-top:3px}
.sign-score{font-family:var(--cond);font-weight:700;font-size:1.25rem;text-align:right;white-space:nowrap}
.sign-score small{display:block;font-family:"Barlow",sans-serif;font-weight:500;font-size:.75rem}
.exam{position:relative;display:block;width:100%;margin-top:14px;text-align:left;cursor:pointer;border:none;border-radius:9px;
  background:#383D42;color:#fff;padding:18px 20px 34px}
.exam::after{content:"";position:absolute;left:20px;right:20px;bottom:14px;height:3px;
  background:repeating-linear-gradient(90deg,#fff 0 26px,transparent 26px 46px)}
.exam-title{display:block;font-family:var(--cond);font-weight:800;font-size:1.7rem;line-height:1.1}
.exam-sub{display:block;opacity:.85}
.foot{margin-top:28px;color:var(--muted);font-size:.9rem}
.linkbtn{background:none;border:none;padding:0;text-decoration:underline;cursor:pointer;color:var(--muted)}

/* Vue groupe */
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:6px}
.back{background:none;border:2px solid var(--road);border-radius:8px;padding:6px 12px;cursor:pointer;font-weight:600}
.top h2{font-family:var(--cond);font-weight:800;font-size:clamp(1.7rem,5vw,2.4rem);margin:0;line-height:1.05}
.tabs{display:flex;gap:6px;margin:14px 0 18px;border-bottom:2px solid var(--line)}
.tab{background:none;border:none;padding:10px 16px;cursor:pointer;font-family:var(--cond);font-weight:700;font-size:1.2rem;color:var(--muted);border-bottom:4px solid transparent;margin-bottom:-2px}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--sign)}
.tools{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.tip{color:var(--muted);font-size:.93rem;max-width:60ch}

/* Carte mentale */
.mm{position:relative;display:grid;grid-template-columns:repeat(3,1fr);grid-template-areas:"a b c" "d x f" "g h i";gap:52px 44px;align-items:center;padding:6px 0 10px}
.mm-roads{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.mm-center{grid-area:x;justify-self:center;position:relative;z-index:1;width:200px;height:200px;border-radius:50%;
  background:#383D42;color:#fff;border:9px solid var(--sign);display:grid;place-items:center;text-align:center;padding:18px;
  font-family:var(--cond);font-weight:800;font-size:1.55rem;line-height:1.05}
.branch{position:relative;z-index:1;display:block;width:100%;text-align:left;cursor:pointer;background:var(--panel);
  border:2px solid var(--road);border-radius:10px;padding:12px 14px}
.branch h4{margin:0 0 6px;font-family:var(--cond);font-weight:700;font-size:1.2rem;line-height:1.15}
.branch ul{margin:0;padding-left:1.1em}
.branch li{margin:2px 0;line-height:1.35}
.branch li.trap{color:var(--bad)}
.mm.masked .branch:not(.shown) ul{padding-left:0}
.mm.masked .branch:not(.shown) li{list-style:none;color:transparent;background:var(--line);border-radius:4px;margin:5px 0;user-select:none}
.mm.masked .branch:not(.shown)::after{content:"Touche pour vérifier";display:block;margin-top:6px;font-size:.8rem;color:var(--muted)}
@media (max-width:780px){
  .mm{grid-template-columns:1fr;grid-template-areas:none;gap:14px;padding-left:42px}
  .mm>*{grid-area:auto!important}
  .mm-roads{display:none}
  .mm::before{content:"";position:absolute;left:10px;top:0;bottom:0;width:16px;background:#383D42;border-radius:3px}
  .mm::after{content:"";position:absolute;left:17px;top:6px;bottom:6px;width:2px;background:repeating-linear-gradient(180deg,#fff 0 9px,transparent 9px 18px)}
  .mm-center{width:auto;height:auto;border-radius:999px;justify-self:stretch;padding:14px 18px;font-size:1.4rem;border-width:6px}
}

/* Quiz */
.qhead{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;color:var(--muted);font-weight:600}
.dashes{display:flex;gap:4px;flex-wrap:wrap;margin:8px 0 20px}
.dashes i{flex:1 1 0;min-width:5px;height:6px;background:var(--line);border-radius:2px}
.dashes i.past{background:var(--road)}
.dashes i.now{background:var(--sign)}
.prompt{font-family:var(--cond);font-weight:700;font-size:clamp(1.45rem,4.2vw,1.9rem);line-height:1.15;margin:0 0 12px;max-width:40ch}
.qbox{max-width:760px}
.tex{display:block;width:100%;max-width:420px;height:auto;border-radius:8px;border:2px solid var(--road);margin:6px 0 4px}
.texcap{font-size:.8rem;color:var(--muted);margin:0 0 8px}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;cursor:pointer;background:var(--panel);
  border:2px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0}
.opt .letter{flex:none;width:32px;height:32px;border-radius:6px;border:2px solid var(--road);display:grid;place-items:center;font-family:var(--cond);font-weight:700;font-size:1.1rem}
.opt .otext{padding-top:3px}
.opt[aria-pressed="true"]{border-color:var(--road)}
.opt[aria-pressed="true"] .letter{background:var(--sign);border-color:var(--sign-ink);color:var(--sign-ink)}
.opt.ok{border-color:var(--ok);background:var(--ok-bg)}
.opt.ok .letter{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:var(--bad-bg)}
.opt.bad .letter{background:var(--bad);border-color:var(--bad);color:#fff}
.opt.miss{border-color:var(--ok);border-style:dashed}
.opt.miss .letter{border-color:var(--ok);color:var(--ok)}
.opt.dim{opacity:.55}
.opt:disabled{cursor:default}
.tag{font-size:.8rem;font-weight:600;margin-left:6px}
.feedback{margin:14px 0 4px;padding:12px 16px;background:var(--panel);border-left:6px solid var(--ok);border-radius:0 10px 10px 0}
.feedback.no{border-left-color:var(--bad)}
.feedback b{font-family:var(--cond);font-size:1.25rem}
.feedback p{margin:4px 0 0}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.primary,.secondary{border-radius:8px;padding:11px 20px;cursor:pointer;font-family:var(--cond);font-weight:700;font-size:1.2rem}
.primary{background:#383D42;color:#fff;border:2px solid #383D42}
.secondary{background:transparent;border:2px solid var(--road)}
.primary:disabled{opacity:.4;cursor:not-allowed}
.keys{color:var(--muted);font-size:.85rem;margin-top:10px}

/* Résultat */
.result{display:grid;grid-template-columns:auto 1fr;gap:24px;align-items:center;max-width:760px}
.limit{width:150px;height:150px;border-radius:50%;background:#fff;color:#111;border:15px solid #C8102E;display:grid;place-items:center;align-content:center;text-align:center}
.limit b{font-family:var(--cond);font-weight:800;font-size:3.3rem;line-height:.9}
.limit span{font-size:.85rem;font-weight:600}
.result p{margin:0;font-size:1.1rem;max-width:40ch}
.errs{max-width:760px;margin-top:26px}
.errs h3{font-family:var(--cond);font-size:1.5rem;margin:0 0 8px}
.err{background:var(--panel);border:2px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0}
.err .eq{font-weight:600}
.err .ea{color:var(--ok);margin-top:4px}
@media (max-width:520px){.result{grid-template-columns:1fr;justify-items:start}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.fix{display:grid;grid-template-columns:1fr auto;align-items:center;gap:14px;width:100%;margin-top:14px;text-align:left;cursor:pointer;
  background:var(--panel);border:3px solid #C8102E;border-radius:9px;padding:16px 18px}
.fix-title{display:block;font-family:var(--cond);font-weight:800;font-size:1.55rem;line-height:1.1}
.fix-sub{display:block;color:var(--muted);font-size:.95rem}
.fix-count{font-family:var(--cond);font-weight:800;font-size:2.2rem;color:#C8102E;line-height:1}
.empty{max-width:60ch;background:var(--panel);border:2px dashed var(--line);border-radius:10px;padding:18px 20px}
.fiches h3{font-family:var(--cond);font-size:1.35rem;margin:22px 0 6px}
.fiche{background:var(--panel);border:2px solid var(--line);border-left:6px solid var(--ok);border-radius:10px;padding:12px 14px;margin:8px 0;max-width:760px}
.fiche .fq{font-weight:600}
.fiche ul{margin:6px 0 0;padding-left:1.1em}
.tab:disabled{opacity:.4;cursor:not-allowed}
</style>
</head>
<body>
<main class="wrap" id="app"></main>
<script>
const GROUPS=[
{id:"g1",title:"Enrobés et centrales",short:"Revêtement, constitution, centrales, couche d’accrochage",
 map:{center:"Enrobés",branches:[
  {t:"Rôle du revêtement",l:["Garantir l’adhérence","Améliorer le confort des usagers","Assurer la circulation"]},
  {t:"Constitution",l:["Mélange HOMOGÈNE","Granulats + bitume + filler"]},
  {t:"Qualités recherchées",l:["Résistance au trafic","Durabilité, résistance à la fatigue","Imperméabilité","Rugosité"]},
  {t:"Types d’enrobés",l:["Tièdes","À chaud","À froid"]},
  {t:"Centrales",l:["Continue : souvent mobile","Discontinue : souvent fixe","Trémies, convoyeurs, tambour sécheur","Malaxeur, silos d’entreposage, rampe de chargement"]},
  {t:"Choix des produits",l:["Épaisseur moyenne d’utilisation","Épaisseur minimale en tout point"]},
  {t:"Couche d’accrochage",l:["Entre béton et enrobé","Entre deux couches d’enrobé","Sur GNT : couche d’imprégnation"]}
 ]},
 qs:[
  {q:"L’objectif d’un revêtement est… ?",o:["Garantir l’adhérence","Améliorer le confort des usagers","Assurer la circulation","Réduire les nuisances sonores"],a:[0,1,2],e:"Adhérence, confort, circulation. La réduction du bruit n’était pas retenue."},
  {q:"Quelle est la constitution d’un enrobé ?",o:["Mélange de granulats, de bitume et de filler","Grave non traitée, bitume et sable","Mélange de granulats, de ciment et de sable","Mélange homogène de granulats, de bitume et de filler"],a:[3],e:"Le mot-clé est « homogène ». La réponse A était comptée fausse."},
  {q:"Quelles sont les caractéristiques recherchées dans un enrobé ?",o:["Résistance au trafic","Durabilité et résistance à la fatigue","Imperméabilité","Rugosité"],a:[0,1,2,3],e:"Les quatre sont justes."},
  {q:"Que peut-on appliquer comme enrobé ?",o:["Les enrobés tièdes","Les enrobés à chaud","Les enrobés à froid","Les enrobés végétaux"],a:[0,1,2],e:"Tièdes, à chaud, à froid. « Végétaux » est le piège."},
  {q:"Quels types de centrales sont couramment utilisés ?",o:["Les centrales hydro-continues","Les centrales discontinues","Les centrales à émulsion","Les centrales continues"],a:[1,3],e:"Continues et discontinues."},
  {q:"Une centrale se compose de… ?",o:["Trémies / convoyeurs / tambour sécheur / malaxeur / silos d’entreposage / rampe de chargement","Trémies / convoyeurs / malaxeur / silos à ciment / arrivée d’eau / pompes","Concasseurs / cribles / bandes transporteuses / broyeurs / trémies","Tambour sécheur / incinérateur / turbines / générateurs / tour de refroidissement"],a:[0],e:"B décrit une centrale à béton, C une installation de concassage."},
  {q:"Les centrales… ?",o:["Continues sont souvent fixes","Continues sont souvent mobiles","Discontinues sont souvent mobiles","Discontinues sont souvent fixes"],a:[1,3],e:"Continue = mobile, discontinue = fixe."},
  {q:"Sur le choix des produits, que dois-je respecter ?",o:["La taille du filler","L’épaisseur moyenne d’utilisation","L’épaisseur minimale en tout point","La couleur de l’enrobé"],a:[1,2],e:"Les deux épaisseurs : moyenne d’utilisation et minimale en tout point."},
  {q:"La couche d’accrochage… ?",o:["Est à prévoir entre le béton et une couche d’enrobé","N’est pas obligatoire","Est à prévoir entre deux couches d’enrobés","Est à prévoir entre la GNT et la couche d’enrobés"],a:[0,2],e:"Béton/enrobé et enrobé/enrobé. Sur GNT, on parle d’imprégnation."},
  {q:"La couche d’accrochage appliquée sur la GNT est appelée… ?",o:["Monocouche double gravillonnage","Couche de GB","Couche d’imprégnation","Enduit superficiel d’usure"],a:[2],e:"Sur GNT : couche d’imprégnation."}
 ]},
{id:"g2",title:"Bitumes et émulsions",short:"Formes des liants, comportement du bitume, émulsion, cut-back",
 map:{center:"Liants hydrocarbonés",branches:[
  {t:"Trois formes",l:["Bitume pur : enrobés, plus de 100 °C","Émulsion : ESU, accrochage, moins de 100 °C","Fluxé : ESU, accrochage, moins de 100 °C"]},
  {t:"Fonctions",l:["Imperméabilité du matériau","Cohésion et adhésivité"]},
  {t:"Bitume pur et température",l:["Élevée : fluide et visqueux, ni cohésion ni adhésivité","Application : solide viscoélastique, cohésion et adhésivité","Froide : solide et fragile, ni cohésion ni adhésivité"]},
  {t:"Essais pour les différencier",l:["Pénétrabilité à 25 °C","Point de ramollissement bille-anneau"]},
  {t:"Émulsion",l:["Bitume + eau + émulsifiant + acide chlorhydrique","Assez fluide pour le circuit et le sol","Assez visqueuse pour ne pas couler"]},
  {t:"Indice de rupture",l:["Les éléments se séparent et se figent"]},
  {t:"Cut-back",l:["Bitume modifié + solvants pétroliers"]}
 ]},
 qs:[
  {q:"Sous quelles formes se présentent les liants bitumineux les plus courants ?",o:["Bitumes purs – fabrication des enrobés – chauffe > 100 °C","Bitumes fluxés ou fluidifiés – fabrication des enrobés – > 100 °C","Émulsions de bitume – ESU ou couche d’accrochage – < 100 °C","Bitumes fluxés ou fluidifiés – ESU ou couche d’accrochage – < 100 °C"],a:[0,2,3],e:"Les fluxés servent aux ESU et à l’accrochage, pas à la fabrication des enrobés."},
  {q:"Quelles sont les fonctions des liants hydrocarbonés ?",o:["Imperméabilité du matériau","Cohésion / adhésivité","Fluidité et capillarité","Rigidité et résistance thermique"],a:[0,1],e:"Imperméabiliser et coller."},
  {q:"Principales caractéristiques d’un bitume pur à température ÉLEVÉE ?",o:["Fluide et visqueux","Solide viscoélastique","Cohésion et adhésivité","Pas de cohésion ni d’adhésivité"],a:[0,3],e:"À chaud : fluide et visqueux, sans cohésion ni adhésivité."},
  {q:"Principales caractéristiques d’un bitume pur à température FROIDE ?",o:["Cohésion et adhésivité","Solide viscoélastique","Solide et fragile","Pas de cohésion ni d’adhésivité"],a:[2,3],e:"À froid : solide et fragile, sans cohésion ni adhésivité."},
  {q:"Principales caractéristiques d’un bitume pur à température d’APPLICATION ?",o:["Fluide et visqueux","Solide viscoélastique","Cohésion et adhésivité","Pas de cohésion ni d’adhésivité"],a:[1,2],e:"Réponse du cours : solide viscoélastique, avec cohésion et adhésivité."},
  {q:"Les deux principales caractéristiques pour différencier les bitumes ?",o:["Le test au gammadensimètre","La pénétrabilité à 25 °C","Le point de ramollissement bille-anneau","Le pénétromètre dynamique"],a:[1,2],e:"Pénétrabilité à 25 °C et bille-anneau. Les deux autres servent aux sols et au compactage."},
  {q:"Quelle est la formulation de l’émulsion de bitume ?",o:["Bitume + solution aqueuse (eau / émulsifiant / acide chlorhydrique)","Bitume + produit pétrolier","Bitume pur simple","Bitume + dégoudronnant actif"],a:[0],e:"Bitume + eau + émulsifiant + acide."},
  {q:"La viscosité de l’émulsion doit être… ?",o:["Extrêmement fluide pour un épandage optimal","Suffisamment fluide pour le circuit d’épandage et la bonne application au sol","Suffisamment visqueuse pour ne pas engendrer de coulures après épandage","Fluide ou visqueuse, peu importe"],a:[1,2],e:"Un compromis : fluide pour le circuit, visqueuse pour ne pas couler."},
  {q:"L’indice de rupture, c’est… ?",o:["Le moment où le produit entre dans un état d’équilibre","Le moment où les éléments se mélangent de façon homogène","Le moment où l’émulsion commence à se déchirer","Le moment où les différents éléments se séparent et se figent"],a:[3],e:"L’eau et le bitume se séparent, puis le bitume se fige."},
  {q:"Qu’est-ce que le « cut-back » ?",o:["Bitume modifié + bisulfure de molybdène","Bitume pur + solution aqueuse + émulsifiant","Bitume pur + liant hydraulique","Bitume modifié + solvants pétroliers"],a:[3],e:"Réponse du cours : bitume modifié + solvants pétroliers. B décrit une émulsion."}
 ]},
{id:"g3",title:"ESU : structures et chantier",short:"Définition, structures LG à GLg, atelier, approvisionnement",
 map:{center:"Enduit superficiel d’usure",branches:[
  {t:"Définition",l:["Couche de roulement de faible épaisseur","Émulsion + gravillons"]},
  {t:"Rôle des gravillons",l:["Adhérence entre chaussée et pneumatiques"]},
  {t:"Structures",l:["L = liant, G = gros gravillon, g = petit","Monocouche : LG","Double gravillonnage : LGg","Bicouche : LGlg","Inversé ou sandwich : GLg"]},
  {t:"Atelier, dans l’ordre",l:["1. Balayage","2. Épandage","3. Gravillonnage","4. Enchâssement"]},
  {t:"Approvisionnement",l:["Continu et rapide","Stocks sans danger pour la circulation","Aires en bon état, pas de pollution"]},
  {t:"Gestion du chantier",l:["Préparation du sol support","Conditions météo","Signalisation"]}
 ]},
 qs:[
  {q:"L’enduit superficiel d’usure est… ?",o:["Une couche de roulement de faible épaisseur constituée de ciment, de sable et de graviers","Une couche de roulement de faible épaisseur constituée de couche d’émulsion et de gravillons","Une couche de roulement de grande épaisseur constituée de bitume, de filler et de gravillons","Une couche de roulement de faible épaisseur constituée de couche d’émulsion et de chaux"],a:[1],e:"Faible épaisseur, émulsion + gravillons."},
  {q:"Que doivent favoriser les caractéristiques mécaniques des gravillons ?",o:["La portance des véhicules lourds","L’adhérence entre la chaussée et les pneumatiques","L’évacuation des eaux de pluie","L’uni de la structure routière"],a:[1],e:"L’adhérence chaussée / pneus."},
  {q:"Structures d’enduit superficiel ?",o:["Le monocouche","Le monocouche double gravillonnage","Le bicouche","Le monocouche inversé ou sandwich"],a:[0,1,2,3],e:"Les quatre structures existent."},
  {q:"L’atelier d’enduisage se compose comment ?",o:["Le balayage / l’épandage / le gravillonnage / l’enchâssement du gravillon","Le balayage / le gravillonnage / l’épandage / l’enchâssement du gravillon","L’épandage / le gravillonnage / le balayage / l’enchâssement du gravillon","Le gravillonnage / l’enchâssement du gravillon / le balayage / l’épandage"],a:[0],e:"On nettoie, on met le liant, on met les gravillons, on les enchâsse."},
  {q:"Quelle est la structure du BICOUCHE ?",o:["LG","LGg","LGlg","GLg"],a:[2],e:"Liant, gros gravillon, liant, petit gravillon."},

/* Illustrations schématiques des dégradations */
function rng(seed){return()=>{seed=(seed*16807)%2147483647;return(seed-1)/2147483646}}
function blob(r,cx,cy,rad){let p=[];for(let k=0;k<11;k++){const a=k/11*Math.PI*2,rr=rad*(.6+r()*.6);p.push((cx+Math.cos(a)*rr*1.5).toFixed(1)+","+(cy+Math.sin(a)*rr).toFixed(1))}return p.join(" ")}
function tex(kind){
  const W=320,H=140,r=rng(kind.length*977+31);
  let s=`<svg class="tex" viewBox="0 0 ${W} ${H}" role="img" aria-label="Illustration schématique"><rect width="${W}" height="${H}" fill="#7B7F82"/>`;
  const dots=(skip,keep)=>{let o="";for(let y=4;y<H;y+=7)for(let x=4+(Math.round(y/7)%2)*3;x<W;x+=7){if(keep&&!keep(x,y))continue;if(r()<skip){o+=`<circle cx="${x}" cy="${y}" r="1.5" fill="#3B3E41"/>`;continue}o+=`<circle cx="${(x+(r()-.5)*2).toFixed(1)}" cy="${(y+(r()-.5)*2).toFixed(1)}" r="${(2.2+r()*1.2).toFixed(1)}" fill="${r()<.5?"#B6BABC":"#999DA0"}"/>`}return o};
  if(kind==="plumage"){s+=dots(.4)}
  else if(kind==="peignage"){for(let y=0;y<H;y+=28)s+=`<rect x="0" y="${y+14}" width="${W}" height="14" fill="#4A4E51"/>`;s+=dots(0,(x,y)=>Math.floor(y/14)%2===0)}
  else if(kind==="pelade"){s+=dots(0);[[70,45,26],[210,90,32],[260,30,18]].forEach(([x,y,d])=>{s+=`<polygon points="${blob(r,x,y,d)}" fill="#5C554D" stroke="#3E3934" stroke-width="2"/>`})}
  else{s+=dots(0);[[40,48],[110,52],[190,46],[270,50],[70,100],[160,96],[240,102]].forEach(([x,y])=>{s+=`<polygon points="${blob(r,x,y,16)}" fill="#141414" opacity=".92"/><ellipse cx="${x-6}" cy="${y-4}" rx="9" ry="3" fill="#fff" opacity=".22"/>`})}
  return s+"</svg>";
}

function drawRoads(){
  const mm=document.getElementById("mm"),svg=document.getElementById("roads");
  if(!mm||!svg)return;
  const box=mm.getBoundingClientRect(),c=mm.querySelector(".mm-center").getBoundingClientRect();
  const cx=c.left+c.width/2-box.left,cy=c.top+c.height/2-box.top;
  let base="",dash="";
  mm.querySelectorAll(".branch").forEach(b=>{
    const r=b.getBoundingClientRect();
    const x=Math.min(Math.max(cx,r.left-box.left),r.right-box.left),y=Math.min(Math.max(cy,r.top-box.top),r.bottom-box.top);
    const d=`M${cx.toFixed(1)} ${cy.toFixed(1)} L${x.toFixed(1)} ${y.toFixed(1)}`;
    base+=`<path d="${d}" stroke="#383D42" stroke-width="14" stroke-linecap="round"/>`;
    dash+=`<path d="${d}" stroke="#fff" stroke-width="2" stroke-dasharray="8 9"/>`;
  });
  svg.setAttribute("viewBox",`0 0 ${box.width} ${box.height}`);
  svg.innerHTML=base+dash;
}
window.addEventListener("resize",()=>{if(view.name==="group"&&view.tab==="map")drawRoads()});

/* Quiz */
function startQuiz(mode,gi,items){
  let pool=mode==="exam"?ALLQ:mode==="err"?errItems():GROUPS[gi].qs;
  if(items)pool=items;
  if(!pool.length){view={name:"errors",tab:"fiches"};quiz=null;return render()}
  quiz={mode,gi,full:!items&&mode!=="err",items:shuffle(pool),i:0,sel:new Set(),done:false,score:0,errors:[],finished:false};
  view=mode==="exam"?{name:"exam"}:mode==="err"?{name:"errors",tab:"quiz"}:{name:"group",gi,tab:"quiz"};
  render();
}
function same(a,b){return a.size===b.length&&b.every(x=>a.has(x))}
function quizBox(){
  if(view.name==="exam"){
    if(!document.getElementById("qz")){
      app.innerHTML=`<nav class="top"><button class="back" id="back">‹ Groupes</button><h2>Examen blanc</h2></nav><div id="qz" style="margin-top:14px"></div>`;
      document.getElementById("back").onclick=goHome;
    }
    return document.getElementById("qz");
  }
  return document.getElementById("pane");
}
function renderQuiz(){
  const box=quizBox();
  if(quiz.finished)return renderResult(box);
  const it=quiz.items[quiz.i],n=quiz.items.length;
  const opts=it.o.map((t,k)=>{
    let cls="",tag="";
    if(quiz.done){const good=it.a.includes(k),s=quiz.sel.has(k);
      if(good&&s)cls="ok";else if(good){cls="miss";tag=`<span class="tag">oubliée</span>`}else if(s)cls="bad";else cls="dim"}
    return `<button class="opt ${cls}" data-k="${k}" aria-pressed="${quiz.sel.has(k)}" ${quiz.done?"disabled":""}><span class="letter">${L[k]}</span><span class="otext">${esc(t)}${tag}</span></button>`}).join("");
  const right=quiz.done&&same(quiz.sel,it.a);
  const origin=quiz.mode==="group"?"":`Groupe ${it.gi+1}, ${esc(GROUPS[it.gi].title)}`;
  box.innerHTML=`
  <div class="qbox">
    <div class="qhead"><span>Question ${quiz.i+1} sur ${n}</span><span>${origin||"Coche toutes les bonnes réponses"}</span></div>
    <div class="dashes">${quiz.items.map((_,k)=>`<i class="${k<quiz.i?"past":k===quiz.i?"now":""}"></i>`).join("")}</div>
    <h3 class="prompt">${esc(it.q)}</h3>
    ${it.img?tex(it.img)+`<p class="texcap">Illustration schématique. À l’examen, ce sera une photo.</p>`:""}
    <div id="opts">${opts}</div>
    ${quiz.done?`<div class="feedback ${right?"":"no"}"><b>${right?"Juste.":"Pas tout à fait."}</b><p>Bonne réponse : ${it.a.map(k=>L[k]).join(", ")}.</p><p>${esc(it.e)}</p>${right?"":`<p>Cette question est ajoutée à « Mes erreurs ».</p>`}</div>`:""}
    <div class="actions">
      ${quiz.done?`<button class="primary" id="next">${quiz.i+1<n?"Question suivante":"Voir mon score"}</button>`:`<button class="primary" id="val" ${quiz.sel.size?"":"disabled"}>Valider</button>`}
    </div>
    <p class="keys">Clavier : 1 à 4 pour cocher, Entrée pour valider.</p>
  </div>`;
  box.querySelectorAll(".opt").forEach(b=>b.onclick=()=>toggle(+b.dataset.k));
  const v=document.getElementById("val"),nx=document.getElementById("next");
  if(v)v.onclick=validate;
  if(nx){nx.onclick=next;nx.focus({preventScroll:true})}
}
function toggle(k){if(quiz.done)return;quiz.sel.has(k)?quiz.sel.delete(k):quiz.sel.add(k);renderQuiz()}
function validate(){
  if(!quiz.sel.size||quiz.done)return;
  const it=quiz.items[quiz.i];quiz.done=true;
  const ok=same(quiz.sel,it.a);
  if(ok)quiz.score++;else quiz.errors.push(it);
  markErr(it,!ok);
  renderQuiz();
}
function next(){
  quiz.i++;quiz.sel=new Set();quiz.done=false;
  if(quiz.i>=quiz.items.length){
    quiz.finished=true;
    if(quiz.full){const key=quiz.mode==="exam"?"exam":GROUPS[quiz.gi].id;prog[key]=Math.max(prog[key]??0,quiz.score);save()}
  }
  renderQuiz();window.scrollTo({top:0});
}
function renderResult(box){
  const n=quiz.items.length,s=quiz.score,ratio=s/n,left=prog.errs.length,mode=quiz.mode;
  let msg;
  if(mode==="err")msg=left?`Il reste ${left} question${left>1?"s":""} dans « Mes erreurs ». Relis les fiches, puis recommence.`:"Toutes tes erreurs sont corrigées. Passe l’examen blanc pour vérifier.";
  else msg=ratio===1?(mode==="exam"?"Sans faute sur les 50. Tu es prêt pour vendredi.":"Groupe maîtrisé. Passe au suivant."):ratio>=.8?"Presque. Tes erreurs sont dans « Mes erreurs » : corrige-les là-bas.":"Relis la carte mentale en mode masqué, puis retente.";
  box.innerHTML=`
  <div class="result">
    <div class="limit"><b>${s}</b><span>sur ${n}</span></div>
    <p>${msg}</p>
  </div>
  <div class="actions">
    ${left&&mode!=="err"?`<button class="primary" id="errs">Corriger mes erreurs (${left})</button>`:""}
    ${left&&mode==="err"?`<button class="primary" id="again">Recommencer mes erreurs</button>`:""}
    ${mode!=="err"?`<button class="secondary" id="again">Recommencer ${mode==="exam"?"l’examen":"le quiz"}</button>`:""}
    ${mode==="group"?`<button class="secondary" id="map">Revoir la carte</button>`:""}
    ${mode==="err"&&left?`<button class="secondary" id="fiches">Revoir les fiches</button>`:""}
    <button class="secondary" id="home">Retour aux groupes</button>
  </div>
  ${quiz.errors.length?`<section class="errs"><h3>À revoir</h3>${quiz.errors.map(it=>`
    <div class="err"><div class="eq">${esc(it.q)}</div>
    <div class="ea">${it.a.map(k=>`${L[k]}. ${esc(it.o[k])}`).join("<br>")}</div></div>`).join("")}</section>`:""}`;
  const gi=quiz.gi;
  const on=(id,f)=>{const b=document.getElementById(id);if(b)b.onclick=f};
  on("errs",()=>{quiz=null;view={name:"errors",tab:"fiches"};render()});
  on("again",()=>startQuiz(mode,gi));
  on("map",()=>{quiz=null;view={name:"group",gi,tab:"map"};render()});
  on("fiches",()=>{quiz=null;view={name:"errors",tab:"fiches"};render()});
  on("home",goHome);
}
function goHome(){quiz=null;view={name:"home"};render()}
document.addEventListener("keydown",e=>{
  if(!quiz||quiz.finished||e.metaKey||e.ctrlKey||e.altKey)return;
  const inQuiz=view.name==="exam"||(view.name==="group"&&view.tab==="quiz")||(view.name==="errors"&&view.tab==="quiz");if(!inQuiz)return;
  if(e.target&&e.target.classList&&e.target.classList.contains("tab"))return;
  const map={"1":0,"2":1,"3":2,"4":3,"a":0,"b":1,"c":2,"d":3};
  const k=map[e.key.toLowerCase()];
  if(k!=null&&!quiz.done){e.preventDefault();toggle(k)}
  else if(e.key==="Enter"){e.preventDefault();quiz.done?next():validate()}
});

function render(){
  if(view.name==="home")renderHome();
  else if(view.name==="exam")renderQuiz();
  else if(view.name==="errors")renderErrors();
  else renderGroup();
  const inQuiz=view.name==="exam"||view.tab==="quiz";
  if(!inQuiz)window.scrollTo({top:0});
}
render();
</script>
</body>
</html>
